name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}

      # The extension has no runtime or dev dependencies, so there is nothing
      # to install — every script runs on the Node standard library alone.
      - name: Check JavaScript syntax
        run: npm run lint:syntax

      - name: Check optional Python tool syntax
        run: python3 -m py_compile scripts/*.py

      - name: Validate manifest and icons
        run: npm run lint:manifest

      - name: Unit tests
        run: npm test

      - name: Validate documentation indexes
        run: npm run lint:docs

  artwork:
    name: Optional artwork tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test existing Pillow tools with synthetic images
        run: |
          python3 -m venv "$RUNNER_TEMP/artwork-venv"
          "$RUNNER_TEMP/artwork-venv/bin/python" -m pip install --only-binary=:all: Pillow==13.0.0
          "$RUNNER_TEMP/artwork-venv/bin/python" -W error::ResourceWarning -m unittest discover -s test -p '*_test.py'

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: [check, artwork]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      - name: Build the store archive
        run: npm run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: extension-zip
          path: dist/*.zip
          if-no-files-found: error
